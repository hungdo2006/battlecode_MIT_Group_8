name: Phase 4.2E Baseline QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only CI: no credentials, production migrations or live Docker volumes.
permissions:
  contents: read

concurrency:
  group: qa-baseline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  b13-compose-config:
    name: B1.3–B1.5 resolved Compose safety (no containers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate actual Compose order with synthetic private override
        run: |
          python scripts/check_b13_compose_config.py
          python scripts/check_b14_compose_config.py
          python scripts/check_b15_compose_config.py

  regression:
    name: Python 3.13 and Node 24 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Validate frontend assets and syntax
        run: |
          node --check frontend/app.js
          node --check frontend/renderers.js
          node --check frontend/ui.js
          node --check frontend/protocol.js
          node --check frontend/lan.js
          node scripts/check_account_frontend_routing.cjs
          python scripts/version_frontend.py --check
      - name: Full Python and controller regression
        run: |
          python -m pytest tests controller_tests -v -ra --tb=short --durations=20 -o faulthandler_timeout=60 --junitxml=qa-ci/pytest.xml
      - name: Verify clean generated file state
        if: always()
        run: git diff --check
      - name: Upload baseline test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase42e-baseline-${{ matrix.os }}
          path: qa-ci/pytest.xml
          if-no-files-found: ignore
          retention-days: 7

# Browser, Docker sandbox, crash tests and Account-Only real execution are
# separate release gates documented in docs/QA.md.
# They are intentionally NOT reported as passing from this baseline workflow.
