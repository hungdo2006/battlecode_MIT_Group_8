# B1.5: SAME B1.4 pilot project/database with the sandbox on this EC2.
# Run ONLY through the guarded B1.3/B1.5 operator switch; do not `up` manually.
# Existing pilot_data/pilot_uploads/Caddy volumes are never replaced.
# NEVER combine with compose.yaml, compose.override.yaml or compose.public.yaml.
# Original stack must release ports 80/443 before this gateway starts.
name: neon-b1-ec2-pilot

services:
  bot-image:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: neon-b1-pilot-local-bot:4.0
    command: ["/bin/true"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 16

  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    image: neon-b1-pilot-local-controller:4.0
    init: true
    # No published ports; only backend and controller share this internal network.
    networks: [runner_private]
    depends_on:
      bot-image:
        condition: service_completed_successfully
    environment:
      ARENA_RUNNER_TOKEN: "${ARENA_RUNNER_TOKEN:?Set a random token of at least 32 characters in .env}"
      SANDBOX_NAMESPACE: neon-b1-ec2-pilot-local
      SANDBOX_IMAGE: neon-b1-pilot-local-bot:4.0
    group_add:
      # Desktop commonly uses 0. Linux: stat -c %g /var/run/docker.sock.
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      # TRUSTED controller ONLY. Powerful Docker Engine access, not a sandbox itself.
      - /var/run/docker.sock:/var/run/docker.sock
      - local_artifacts:/artifacts
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      options:
        max-size: 5m
        max-file: "2"

  arena:
    build:
      context: .
      target: runtime
    image: neon-b1-ec2-pilot-arena:1.0
    init: true
    networks: [ingress_private, runner_private]
    depends_on:
      controller:
        condition: service_healthy
    environment:
      ARENA_RUNNER: sandbox
      ARENA_CONTROLLER_URL: http://controller:9000
      ARENA_RUNNER_TOKEN: "${ARENA_RUNNER_TOKEN:?Use a unique EC2-only 32+ character Controller token}"
      ARENA_READ_ONLY: "0"
      ARENA_ACCOUNT_AUTH: "1"
      ARENA_ACCOUNT_ONLY: "1"
      ARENA_PUBLIC_GATEWAY: "1"
      ARENA_AUTH_ALLOW_HTTP: "0"
      ARENA_SELF_REGISTRATION: "1"
      ARENA_PUBLIC_USERNAME_SIGNUP: "1"
      ARENA_EMAIL_VERIFICATION: "0"
      ARENA_ADMIN_TOTP_REQUIRED: "0"
      ARENA_PUBLIC_ADMIN_PASSWORD_ONLY: "1"
      ARENA_AUTH_ORIGINS: "https://${ARENA_PUBLIC_DOMAIN:?Set verified public hostname}"
      ARENA_ALLOWED_HOSTS: "${ARENA_PUBLIC_DOMAIN:?Set verified public hostname}"
      ARENA_PROXY_SECRET: "${ARENA_PROXY_SECRET:?Set a separate private 48+ character proxy secret}"
    volumes:
      - pilot_data:/app/data
      - pilot_uploads:/app/uploads
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    logging:
      options:
        max-size: 5m
        max-file: "2"

  gateway:
    image: caddy:2.9.1-alpine
    depends_on: [arena]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks: [default, ingress_private]
    environment:
      ARENA_PUBLIC_DOMAIN: "${ARENA_PUBLIC_DOMAIN:?Set verified public hostname}"
      ARENA_PROXY_SECRET: "${ARENA_PROXY_SECRET:?Set a separate private 48+ character proxy secret}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - pilot_caddy_data:/data
      - pilot_caddy_config:/config
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      options:
        max-size: 5m
        max-file: "2"

networks:
  ingress_private:
    internal: true
  runner_private:
    internal: true

volumes:
  local_artifacts:
  pilot_data:
  pilot_uploads:
  pilot_caddy_data:
  pilot_caddy_config:
